# Apache 2.4 + PHP (libapache2-mod-php oder php-fpm)
# Installation: Projekt nach /var/www/prox-web kopieren, diese Datei nach
# /etc/apache2/sites-available/ legen, `a2ensite prox-web && systemctl reload apache2`.
# Benutzerdatei anlegen: htpasswd -c /etc/apache2/prox-web.htpasswd admin

<VirtualHost *:80>
    ServerName prox-web.local
    DocumentRoot /var/www/prox-web/public

    <Directory /var/www/prox-web/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Adminbereich nur mit Anmeldung
    <Directory /var/www/prox-web/public/admin>
        AuthType Basic
        AuthName "prox-web Admin"
        AuthUserFile /etc/apache2/prox-web.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/prox-web-error.log
    CustomLog ${APACHE_LOG_DIR}/prox-web-access.log combined
</VirtualHost>
